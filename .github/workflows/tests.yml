name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
  MPLBACKEND: Agg

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  uchrom:
    name: uchrom (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: packages/uchrom/pyproject.toml

      # Qt (xcb) + VTK/OpenGL runtime libs for the headless browser smoke
      # test, which runs under xvfb.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1 libegl1 libglu1-mesa libfontconfig1 libdbus-1-3 \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 \
            libxcb-xfixes0 libxcb-shape0 libxcb-cursor0

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          # the monorepo's packages (packages/) first: they are not on PyPI yet
          pip install -e "packages/chromdata[all]" -e "packages/uchrom-browser[test]" \
            -e "packages/uchrom[browser,web,anndata,im,snapfish,spatial]" pytest httpx

      # each package's own suite (a `tests` package each: run from its folder)
      - name: Run tests
        run: |
          (cd packages/uchrom && xvfb-run -a -s "-screen 0 1280x1024x24" \
            python -m pytest tests -m "not slow and not gpu" -ra)
          (cd packages/chromdata && python -m pytest tests -ra)
          (cd packages/uchrom-browser && python -m pytest tests -ra)
          (cd apps/atlas && python -m pytest tests -ra)

  web-frontend:
    name: web browser frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/uchrom-browser/uchrom_browser/frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: packages/uchrom-browser/uchrom_browser/frontend/package-lock.json

      - name: Install, test, build
        run: |
          npm ci
          npm test
          npm run build

      # The built bundle is committed so `pip install` users need no Node;
      # fail if it is stale relative to the sources.
      - name: Committed static/ matches the build
        run: |
          if [ -n "$(git status --porcelain -- ../static)" ]; then
            git status --porcelain -- ../static
            echo "::error::packages/uchrom-browser/uchrom_browser/static is stale; run npm run build and commit it"
            exit 1
          fi

  discovery:
    name: uchrom-discovery (py3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            packages/uchrom/pyproject.toml
            packages/uchrom-discovery/pyproject.toml

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/chromdata -e "packages/uchrom[anndata]" -e ./packages/uchrom-discovery pytest

      # Run from packages/uchrom-discovery/ — every package's suite is a top-level ``tests`` package.
      - name: Run tests
        working-directory: packages/uchrom-discovery
        run: python -m pytest tests -ra

  recon-native:
    # Native reconstruction engine (packages/uchrom-recon, Rust + PyO3): Rust unit tests,
    # a CPU-only wheel (no GPU feature), the default wheel (with the wgpu
    # backend) and the Python tests against it.  GPU tests skip themselves
    # when the runner has no usable adapter.
    name: uchrom-recon native engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/uchrom-recon/target
          key: recon-${{ runner.os }}-${{ hashFiles('packages/uchrom-recon/Cargo.lock') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            packages/uchrom/pyproject.toml
            packages/uchrom-recon/pyproject.toml

      - name: Rust tests
        working-directory: packages/uchrom-recon
        run: |
          cargo test --release
          cargo test --release --features gpu

      - name: Build wheels (CPU-only, and default with GPU)
        working-directory: packages/uchrom-recon
        run: |
          python -m pip install --upgrade pip maturin
          # --features on the command line replaces the pyproject list: CPU only
          maturin build --release --features python -o dist-cpu
          maturin build --release -o dist

      - name: Install uchrom and the engine
        run: |
          pip install -e packages/chromdata -e packages/uchrom pytest
          pip install packages/uchrom-recon/dist/*.whl
          python -c "import uchrom_recon as u; print(u.__version__, u.HAS_GPU, u.gpu_info())"

      - name: Python tests
        working-directory: packages/uchrom
        run: python -m pytest tests/recon -m "not slow" -ra
