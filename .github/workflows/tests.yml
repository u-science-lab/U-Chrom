name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
  MPLBACKEND: Agg

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  uchrom:
    name: uchrom (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      # Qt (xcb) + VTK/OpenGL runtime libs for the headless browser smoke
      # test, which runs under xvfb.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1 libegl1 libglu1-mesa libfontconfig1 libdbus-1-3 \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 \
            libxcb-xfixes0 libxcb-shape0 libxcb-cursor0

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[browser,anndata,im,snapfish]" pytest

      - name: Run tests
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" \
            python -m pytest tests -m "not slow and not gpu" -ra

  discovery:
    name: uchrom-discovery (py3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            discovery/pyproject.toml

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[anndata]" -e ./discovery pytest

      # Run from discovery/ — both suites define a top-level ``tests`` package.
      - name: Run tests
        working-directory: discovery
        run: python -m pytest tests -ra
