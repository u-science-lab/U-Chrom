<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Takei 2025 Auto-discovery Idea Graph</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fb;
      --panel: #ffffff;
      --ink: #17202a;
      --muted: #5e6b78;
      --line: #d8dee8;
      --accent: #1d6fd3;
      --good: #2a9d55;
      --bad: #d64545;
      --warn: #c8841b;
      --soft: #eef4fb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    header {
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      position: sticky;
      top: 0;
      z-index: 5;
    }
    h1 { margin: 0; font-size: 20px; letter-spacing: 0; }
    .subtle { color: var(--muted); }
    .layout {
      display: grid;
      grid-template-columns: 280px minmax(420px, 1fr) 360px;
      gap: 12px;
      height: calc(100vh - 58px);
      padding: 12px;
    }
    aside, main, section.detail {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      min-height: 0;
    }
    aside, section.detail {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-head {
      padding: 12px;
      border-bottom: 1px solid var(--line);
      font-weight: 650;
    }
    .panel-body { padding: 12px; overflow: auto; }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .stat {
      padding: 9px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--soft);
    }
    .stat b { display: block; font-size: 18px; }
    input, select {
      width: 100%;
      padding: 8px 9px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
    }
    .filters { display: grid; gap: 8px; margin-bottom: 12px; }
    .legend { display: grid; gap: 6px; }
    .legend-row { display: flex; align-items: center; gap: 8px; }
    .dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
    main { position: relative; overflow: hidden; }
    svg { width: 100%; height: 100%; display: block; background: #fbfcfe; }
    .edge { stroke: #9aa7b7; stroke-opacity: .38; stroke-width: 1.2; }
    .edge.strong { stroke-opacity: .76; stroke-width: 2; }
    .node circle {
      stroke: #fff;
      stroke-width: 2;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.18));
      cursor: pointer;
    }
    .node text {
      pointer-events: none;
      font-size: 11px;
      fill: #263544;
      paint-order: stroke;
      stroke: white;
      stroke-width: 3px;
      stroke-linejoin: round;
    }
    .node.selected circle { stroke: #111827; stroke-width: 3; }
    .pill {
      display: inline-block;
      padding: 2px 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
      margin: 2px 4px 2px 0;
      background: #fff;
      color: var(--muted);
      font-size: 12px;
    }
    .status-supported { color: var(--good); font-weight: 700; }
    .status-contradicted { color: var(--bad); font-weight: 700; }
    .status-borderline { color: var(--warn); font-weight: 700; }
    .kv { margin-bottom: 10px; }
    .kv .key { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    .kv .value { white-space: pre-wrap; overflow-wrap: anywhere; }
    .links a {
      display: block;
      color: var(--accent);
      text-decoration: none;
      margin: 4px 0;
      overflow-wrap: anywhere;
    }
    .links a:hover { text-decoration: underline; }
    .node-list { display: grid; gap: 6px; }
    .node-list button {
      text-align: left;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 6px;
      padding: 7px 8px;
      cursor: pointer;
      color: var(--ink);
    }
    .node-list button:hover { border-color: var(--accent); }
    @media (max-width: 1100px) {
      .layout { grid-template-columns: 240px 1fr; }
      section.detail { grid-column: 1 / -1; min-height: 320px; }
    }
  </style>
</head>

 "tested_by": 20, "uses_cell_type": 58, "uses_gene": 7, "uses_marker": 31, "uses_modality": 62}, "hypothesis_status": {"Borderline": 1, "Contradicted": 4, "Not supported": 9, "Supported": 6}, "coverage": {"cell_types": {"Bergmann": 1, "Granule": 1, "Purkinje": 1}, "genes": {"Aldoc": 1, "Gabra6": 1, "Pcp2": 1, "Reln": 1}, "markers": {"BRD4": 1, "CBP": 1, "H3K27ac": 1, "H3K4me1": 1, "H3K9me3": 1, "HP1alpha": 1, "LaminB1": 1, "MajSat": 1, "MinSat": 1, "RNAPIISer2-P": 1, "Xist_RNA": 1, "n_per_dist(um)": 1, "n_rad_score": 1, "polyA_RNA": 1, "rDNA": 1}, "modalities": {"cell_metadata": 1, "chromatin_tracing": 1, "if_tracks": 1, "rna_expression": 1}, "parameter_families": {"expression_association": 1, "inter_chromosomal": 1, "radial_position": 1, "spatial_distance": 1}}}, "notebook_base_url": "../_auto_discovery_notebooks"};
const nodes = GRAPH.nodes.map(d => ({...d}));
const edges = GRAPH.edges.map(d => ({...d}));
const byId = new Map(nodes.map(n => [n.id, n]));
const notebookBaseUrl = GRAPH.notebook_base_url || "";
const colors = {
  Idea: "#4c78a8",
  EvidenceResult: "#59a14f",
  NotebookRun: "#9c755f",
  LiteratureClaim: "#f28e2b",
  Reference: "#edc948",
  Gene: "#b07aa1",
  IFMarker: "#e15759",
  CellType: "#76b7b2",
  Modality: "#bab0ab",
  ParameterFamily: "#8cd17d",
  IdeaReview: "#b8bcc6",
  Run: "#6b7280"
};
const graph = document.getElementById("graph");
const detail = document.getElementById("detail");
const nodeList = document.getElementById("nodeList");
const search = document.getElementById("search");
const kindFilter = document.getElementById("kindFilter");
const width = () => graph.clientWidth || 800;
const height = () => graph.clientHeight || 600;
let selectedId = null;
let filteredIds = new Set(nodes.map(n => n.id));

document.getElementById("subtitle").textContent =
  `${GRAPH.summary?.n_nodes ?? nodes.length} nodes, ${GRAPH.summary?.n_edges ?? edges.length} edges`;

const kindCounts = new Map();
for (const n of nodes) kindCounts.set(n.kind, (kindCounts.get(n.kind) || 0) + 1);
for (const [kind, count] of [...kindCounts.entries()].sort()) {
  const opt = document.createElement("option");
  opt.value = kind;
  opt.textContent = `${kind} (${count})`;
  kindFilter.appendChild(opt);
}

document.getElementById("stats").innerHTML = [
  ["Ideas", nodes.filter(n => n.kind === "Idea").length],
  ["Evidence", nodes.filter(n => n.kind === "EvidenceResult").length],
  ["Claims", nodes.filter(n => n.kind === "LiteratureClaim").length],
  ["Notebooks", nodes.filter(n => n.kind === "NotebookRun").length],
].map(([k,v]) => `<div class="stat"><b>${v}</b><span>${k}</span></div>`).join("");

document.getElementById("legend").innerHTML = [...kindCounts.keys()].sort()
  .map(k => `<div class="legend-row"><span class="dot" style="background:${colors[k] || "#999"}"></span>${k}</div>`)
  .join("");

function label(n) {
  return n.title || n.label || n.claim || n.idea_id || n.claim_id || n.reference_id || n.id;
}

function searchable(n) {
  return JSON.stringify(n).toLowerCase();
}

function applyFilters() {
  const q = search.value.trim().toLowerCase();
  const kind = kindFilter.value;
  filteredIds = new Set(nodes.filter(n => (!kind || n.kind === kind) && (!q || searchable(n).includes(q))).map(n => n.id));
  render();
}
search.addEventListener("input", applyFilters);
kindFilter.addEventListener("change", applyFilters);

function layoutNodes() {
  const W = width(), H = height();
  const centerX = W / 2, centerY = H / 2;
  const kindRing = {
    Run: 0.08,
    Idea: 0.34,
    EvidenceResult: 0.52,
    NotebookRun: 0.66,
    LiteratureClaim: 0.74,
    Reference: 0.86,
  };
  const groups = new Map();
  for (const n of nodes) {
    const r = kindRing[n.kind] ?? 0.82;
    const key = String(r);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(n);
  }
  for (const [key, group] of groups.entries()) {
    const radius = Math.min(W, H) * Number(key);
    group.sort((a, b) => label(a).localeCompare(label(b)));
    group.forEach((n, i) => {
      const angle = (2 * Math.PI * i / Math.max(1, group.length)) - Math.PI / 2;
      n.x = centerX + Math.cos(angle) * radius;
      n.y = centerY + Math.sin(angle) * radius;
    });
  }
  for (const n of nodes.filter(n => n.kind === "Run")) {
    n.x = centerX; n.y = centerY;
  }
}

function visibleEdges() {
  return edges.filter(e => filteredIds.has(e.source) && filteredIds.has(e.target));
}

function render() {
  layoutNodes();
  graph.innerHTML = "";
  const ns = "http://www.w3.org/2000/svg";
  graph.setAttribute("viewBox", `0 0 ${width()} ${height()}`);
  const edgeLayer = document.createElementNS(ns, "g");
  const nodeLayer = document.createElementNS(ns, "g");
  graph.append(edgeLayer, nodeLayer);
  const related = new Set();
  if (selectedId) {
    for (const e of edges) {
      if (e.source === selectedId || e.target === selectedId) {
        related.add(e.source); related.add(e.target);
      }
    }
  }
  for (const e of visibleEdges()) {
    const a = byId.get(e.source), b = byId.get(e.target);
    if (!a || !b) continue;
    const line = document.createElementNS(ns, "line");
    line.setAttribute("x1", a.x); line.setAttribute("y1", a.y);
    line.setAttribute("x2", b.x); line.setAttribute("y2", b.y);
    line.setAttribute("class", "edge" + (selectedId && (e.source === selectedId || e.target === selectedId) ? " strong" : ""));
    edgeLayer.appendChild(line);
  }
  for (const n of nodes) {
    if (!filteredIds.has(n.id)) continue;
    const g = document.createElementNS(ns, "g");
    g.setAttribute("class", "node" + (n.id === selectedId ? " selected" : ""));
    g.setAttribute("transform", `translate(${n.x},${n.y})`);
    if (selectedId && !related.has(n.id) && selectedId !== n.id) g.setAttribute("opacity", "0.38");
    const c = document.createElementNS(ns, "circle");
    c.setAttribute("r", radiusFor(n));
    c.setAttribute("fill", colors[n.kind] || "#999");
    const t = document.createElementNS(ns, "text");
    t.setAttribute("x", radiusFor(n) + 4);
    t.setAttribute("y", 4);
    t.textContent = truncate(label(n), 34);
    g.append(c, t);
    g.addEventListener("click", () => selectNode(n.id));
    nodeLayer.appendChild(g);
  }
  renderNodeList();
}

function radiusFor(n) {
  if (n.kind === "Run") return 13;
  if (n.kind === "Idea") return 9;
  if (n.kind === "LiteratureClaim") return 8;
  return 6;
}

function renderNodeList() {
  const visible = nodes.filter(n => filteredIds.has(n.id)).sort((a,b) => label(a).localeCompare(label(b))).slice(0, 80);
  nodeList.innerHTML = visible.map(n =>
    `<button data-node="${escapeAttr(n.id)}"><b>${escapeHtml(n.kind)}</b><br>${escapeHtml(truncate(label(n), 70))}</button>`
  ).join("");
  for (const btn of nodeList.querySelectorAll("button")) {
    btn.addEventListener("click", () => selectNode(btn.dataset.node));
  }
}

function selectNode(id) {
  selectedId = id;
  const n = byId.get(id);
  detail.innerHTML = renderDetail(n);
  render();
}

function neighborEdges(id) {
  return edges.filter(e => e.source === id || e.target === id);
}

function renderDetail(n) {
  if (!n) return "<p>Select a node.</p>";
  const statusClass = n.hypothesis_status === "Supported" ? "status-supported"
    : n.hypothesis_status === "Contradicted" ? "status-contradicted"
    : n.hypothesis_status === "Borderline" ? "status-borderline" : "";
  const rows = [];
  rows.push(kv("Kind", n.kind));
  rows.push(kv("ID", n.id));
  for (const key of [
    "title", "label", "claim", "summary", "biological_hypothesis",
    "computable_parameter", "expected_direction", "hypothesis_status",
    "direction_status", "p_value", "effect_size", "test_method",
    "source_title", "url", "doi", "pmid", "path"
  ]) {
    if (n[key] !== undefined && n[key] !== null && n[key] !== "") {
      const value = key === "hypothesis_status"
        ? `<span class="${statusClass}">${escapeHtml(String(n[key]))}</span>`
        : linkify(key, n[key]);
      rows.push(kv(titleCase(key), value, true));
    }
  }
  if (n.signature) rows.push(kv("Signature", pills(n.signature), true));
  const links = relatedLinks(n);
  if (links) rows.push(`<div class="kv links"><div class="key">Links</div>${links}</div>`);
  const rel = neighborEdges(n.id).slice(0, 30).map(e => {
    const otherId = e.source === n.id ? e.target : e.source;
    const other = byId.get(otherId);
    return `<span class="pill">${escapeHtml(e.relation)} → ${escapeHtml(truncate(label(other || {id: otherId}), 42))}</span>`;
  }).join("");
  if (rel) rows.push(kv("Graph relationships", rel, true));
  return rows.join("");
}

function relatedLinks(n) {
  const out = [];
  if (n.kind === "NotebookRun" && n.path) out.push(notebookLink(n.path, "open notebook/html"));
  if (n.kind === "Idea") {
    const nb = edges.find(e => e.source === n.id && e.relation === "tested_by");
    if (nb) {
      const node = byId.get(nb.target);
      if (node?.path) out.push(notebookLink(node.path, "open exploration notebook"));
    }
  }
  if (n.url) out.push(`<a href="${escapeAttr(n.url)}" target="_blank" rel="noreferrer">open source URL</a>`);
  return out.join("");
}

function notebookLink(path, text) {
  let href = path;
  if (notebookBaseUrl) {
    const name = String(path).split("/").pop().replace(/\\.ipynb$/, ".html");
    href = `${notebookBaseUrl}/${name}`;
  }
  return `<a href="${escapeAttr(href)}" target="_blank" rel="noreferrer">${escapeHtml(text)}</a>`;
}

function kv(key, value, raw=false) {
  return `<div class="kv"><div class="key">${escapeHtml(key)}</div><div class="value">${raw ? value : escapeHtml(String(value))}</div></div>`;
}
function pills(obj) {
  const parts = [];
  for (const [k, v] of Object.entries(obj)) {
    const shown = Array.isArray(v) ? v.join(", ") : String(v);
    if (shown) parts.push(`<span class="pill">${escapeHtml(k)}: ${escapeHtml(shown)}</span>`);
  }
  return parts.join("");
}
function linkify(key, value) {
  const s = String(value);
  if (key === "url" || s.startsWith("http://") || s.startsWith("https://")) return `<a href="${escapeAttr(s)}" target="_blank" rel="noreferrer">${escapeHtml(s)}</a>`;
  return escapeHtml(s);
}
function titleCase(s) { return String(s).replaceAll("_", " ").replace(/\\b\\w/g, m => m.toUpperCase()); }
function truncate(s, n) { s = String(s || ""); return s.length > n ? s.slice(0, n - 1) + "…" : s; }
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => {
    if (c === "&") return "&amp;";
    if (c === "<") return "&lt;";
    if (c === ">") return "&gt;";
    if (c === '"') return "&quot;";
    return "&#39;";
  });
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, "&#96;"); }

selectNode(nodes.find(n => n.kind === "Run")?.id || nodes[0]?.id);
window.addEventListener("resize", render);
</script>
