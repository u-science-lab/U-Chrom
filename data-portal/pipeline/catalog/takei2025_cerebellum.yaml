id: takei2025_cerebellum
title: "Mouse cerebellum DNA seqFISH+ (Takei et al. 2025)"
description: >-
  Genome-scale single-cell chromatin tracing of the adult mouse cerebellum by
  DNA seqFISH+, jointly resolving 3D genome organization, RNA, and protein in
  intact tissue. Distributed as analysis-ready ChromData (.h5cd).
