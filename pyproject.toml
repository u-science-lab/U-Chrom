[build-system]
requires = ["setuptools", "wheel"]

[project]
name = "u-chrom"
version = "0.2.0"
readme = "README.md"
description = "Chromatin structure analysis toolkit."
authors = [
    {name = "Weize Xu", email = "vet.xwz@gmail.com" },
]
requires-python = ">= 3.11"
dependencies = [
    "taichi>=1.7.0",
    "fire>=0.6.0",
    "pandas>=2.0.3",
    "h5py>=3.10.0",
    # ChromData format 2.0 container (.chromdata.zarr / .cdz): Zarr v3 + Parquet
    "zarr>=3.0",
    "pyarrow>=14",
    "cooler>=0.9.3",
    "scikit-learn>=1.3.2",
    "matplotlib>=3.7.5",
    "torch>=2.0",
    "networkx>=3.0",
    "scipy>=1.10",
    "statsmodels>=0.13",
]

[project.optional-dependencies]
# Interactive 3D browser (python -m uchrom.browser).
browser = [
    "vtk>=9.2,<9.4",
    "pyvista>=0.43,<0.45",
    "pyvistaqt>=0.11,<0.12",
    "PyQt5>=5.15.2",
    "qdarkgraystyle>=1.0.2",
]
# Web browser (python -m uchrom.browser --web); no Qt needed.
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
# Reading .hic files (uchrom.io load_hic / benchmark tutorial).
hic = [
    "hic-straw",
]
# Linking ChromData with AnnData (link_anndata / to_anndata, seqFISH RNA).
anndata = [
    "anndata>=0.9",
]
# UMAP cell embeddings (uchrom.emb.embed_cells); PCA / t-SNE need only scikit-learn.
umap = [
    "umap-learn>=0.5",
]
# Linked MuData files (ChromData.link_mudata / load_linked_mudata).
multiome = [
    "mudata>=0.2.0",
]
docs = [
    "sphinx>=7.0",
    "furo>=2024.1",
    "myst-nb>=1.0",
    "sphinx-copybutton>=0.5",
]
# FastHigashi for uchrom.emb.higashi.
# The legacy `higashi` package hard-pins scipy==1.7.3 / pandas==1.3.4 and is
# painful to install via pip; prefer `emb` (FastHigashi) and install the full
# Higashi from the ruochiz conda channel when its co-assay features are needed.
emb = [
    "fasthigashi",
]
emb-full = [
    "u-chrom[emb]",
    "higashi",
]
# Image-side integrations (PyHiM ECSV reader and friends).
# astropy alone is enough for from_pyhim_trace().  The full PyHiM CLI
# is a much heavier dep (TensorFlow + StarDist) — install separately
# in its own environment when you need the imaging pipeline itself.
im = [
    "astropy>=5.0",
]
# SnapFISH-IMPUTE coordinate imputation (uchrom.im.impute method='snapfish').
# scipy and scikit-learn are already core deps; scikit-image is the only extra.
snapfish = [
    "scikit-image>=0.20",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"uchrom.browser.web" = ["static/*", "static/**/*", "API.md"]

[tool.setuptools.packages.find]
include = ["uchrom*"]
exclude = ["example-data*", "tests*"]
