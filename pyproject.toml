[build-system]
requires = ["setuptools", "wheel"]

[project]
name = "u-chrom"
version = "0.2.0"
readme = "README.md"
description = "Chromatin structure analysis toolkit."
authors = [
    {name = "Weize Xu", email = "vet.xwz@gmail.com" },
]
requires-python = ">= 3.8"
dependencies = [
    "taichi>=1.7.0",
    "fire>=0.6.0",
    "pandas>=2.0.3",
    "vispy>=0.14.2",
    "numpy>=1.26,<2.0",
    "PyQt5>=5.15.2",
    "qdarkgraystyle>=1.0.2",
    "h5py>=3.10.0",
    "cooler>=0.9.3",
    "astropy>=6,<7",
    "photutils>=2,<3",
    "scikit-image>=0.22,<0.23",
    "scipy>=1.10,<2.0",
    "scikit-learn>=1.3.2",
    "matplotlib>=3.7.5",
    "csbdeep>=0.7",
    "stardist>=0.8",
    "apifish>=0.6.4.dev0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["uchrom*"]
exclude = ["example-data*", "tests*"]
