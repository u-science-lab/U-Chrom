[build-system]
requires = ["setuptools", "wheel"]

[project]
name = "u-chrom"
version = "0.2.0"
readme = "README.md"
description = "Chromatin structure analysis toolkit."
authors = [
    {name = "Weize Xu", email = "vet.xwz@gmail.com" },
]
requires-python = ">= 3.8"
dependencies = [
    "taichi>=1.7.0",
    "fire>=0.6.0",
    "pandas>=2.0.3",
    "vispy>=0.14.2",
    "PyQt5>=5.15.2",
    "qdarkgraystyle>=1.0.2",
    "h5py>=3.10.0",
    "cooler>=0.9.3",
    "scikit-learn>=1.3.2",
    "matplotlib>=3.7.5",
    "torch>=2.0",
    "networkx>=3.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
docs = [
    "sphinx>=7.0",
    "furo>=2024.1",
    "myst-nb>=1.0",
    "sphinx-copybutton>=0.5",
]
webapp = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["uchrom*"]
exclude = ["example-data*", "tests*"]
