<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>U-Chrom Browser</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      html, body { margin: 0; background: #1b1d21; color: #c9ced6; font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; }
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
      #boot .ring { width: 30px; height: 30px; border: 3px solid #3a3f47; border-top-color: #6ea0ff; border-radius: 50%; animation: boot-spin 0.8s linear infinite; }
      #boot .bar { width: 160px; height: 2px; background: #3a3f47; overflow: hidden; border-radius: 1px; position: relative; }
      #boot .bar::after { content: ""; position: absolute; inset: 0; width: 35%; background: #6ea0ff; animation: boot-slide 1.2s ease-in-out infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(350%); } }
      @media (prefers-color-scheme: light) { html, body { background: #f5f6f8; color: #333; } #boot .ring, #boot .bar { border-color: #d8dce2; background: #d8dce2; } }
    </style>
  </head>
  <body>
    <!-- shown until the app renders (React replaces the contents of #root) -->
    <div id="root"><div id="boot"><div class="ring"></div><div>Loading U-Chrom…</div><div class="bar"></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
