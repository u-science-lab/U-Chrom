[package]
name = "uchrom-maps"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Native kernels of U-Chrom's Hi-C map callers: HiCCUPS scoring, the Mustache scale-space scan, random walk with restart on single-cell maps (multi-core CPU)"
readme = "README.md"
license = "MIT"
publish = false

[lib]
name = "uchrom_maps"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Python bindings (the maturin build enables this).
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
rayon = "1.10"
pyo3 = { version = "0.29", features = ["abi3-py311"], optional = true }
numpy = { version = "0.29", optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
