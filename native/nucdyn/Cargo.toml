[package]
name = "uchrom-nucdyn"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Native NucDynamics engine for U-Chrom: single-cell Hi-C genome structure calculation (multi-core CPU, wgpu GPU)"
license = "LGPL-3.0-or-later"
readme = "README.md"
publish = false

[lib]
name = "uchrom_nucdyn"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Python bindings (the maturin build enables this).
python = ["dep:pyo3", "dep:numpy"]
# GPU backend (wgpu: Metal on macOS, Vulkan on Linux, DX12 on Windows).
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
rayon = "1.10"
nalgebra = { version = "0.35", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pyo3 = { version = "0.29", features = ["abi3-py311"], optional = true }
numpy = { version = "0.29", optional = true }
wgpu = { version = "30", optional = true }
pollster = { version = "1", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
